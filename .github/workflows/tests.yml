name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bobaops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bobaops_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U bobaops -d bobaops_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5433
      POSTGRES_USER: bobaops
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: bobaops
      BOBAOPS_TEST_DATABASE: bobaops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: docker build -t mixue-agent-ci .
      - name: Check image has no private files and runs without root
        run: >-
          docker run --rm --entrypoint python mixue-agent-ci -c
          "import os,pathlib; from app import app; assert os.getuid() != 0; assert not pathlib.Path('/app/.env').exists(); assert not list(pathlib.Path('/app/data/private').rglob('*.*'))"
