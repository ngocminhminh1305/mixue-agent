services:
  db:
    image: mixue_agent_postgres:18
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bobaops}
      POSTGRES_USER: ${POSTGRES_USER:-bobaops}
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "hba_file=/etc/postgresql/project-pg_hba.conf"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/pg_hba.conf:/etc/postgresql/project-pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  pgadmin_data:
