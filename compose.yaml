services:
  app:
    profiles: ["app"]
    build: .
    image: mixue_agent_app:local
    env_file: .env
    environment:
      # Service-to-service traffic uses Docker's internal port.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BOBAOPS_DATA_DIR: /app/data/private
    ports:
      - "127.0.0.1:${APP_PORT:-8006}:8000"
    volumes:
      - app_data:/app/data/private
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  db:
    image: mixue_agent_postgres:18
    pull_policy: never
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bobaops}
      POSTGRES_USER: ${POSTGRES_USER:-bobaops}
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "hba_file=/etc/postgresql/project-pg_hba.conf"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/pg_hba.conf:/etc/postgresql/project-pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  app_data:
  postgres_data:
  pgadmin_data:
