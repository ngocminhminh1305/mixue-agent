<text x="700" y="995" text-anchor="middle" font-size="15">Approved sales lines must use exactly one recipe. Recipe amounts and stock movements use the stock item’s base unit.</text>
<text x="700" y="1060" text-anchor="middle" font-size="23">Preparation recipes: purchased inputs → prepared bases</text><path class="edge" d="M310,1250 L374,1250"/><path class="edge" d="M526,1250 L590,1250"/><path class="edge" d="M810,1250 L874,1250"/><path class="edge" d="M1026,1250 L1090,1250"/><rect class="entity" x="90" y="1218" width="220" height="64"/><text x="200" y="1256" text-anchor="middle" font-size="19">StockItem</text><rect class="entity" x="590" y="1218" width="220" height="64"/><text x="700" y="1256" text-anchor="middle" font-size="19">PreparationRecipe</text><rect class="entity" x="1090" y="1218" width="220" height="64"/><text x="1200" y="1256" text-anchor="middle" font-size="19">StockItem</text><polygon class="relation" points="374,1250 450,1208 526,1250 450,1292"/><text x="450" y="1255" text-anchor="middle" font-size="15">Consumes</text><polygon class="relation" points="874,1250 950,1208 1026,1250 950,1292"/><text x="950" y="1255" text-anchor="middle" font-size="15">Produces</text><text x="340" y="1230" text-anchor="middle" font-size="15">(0,N)</text><text x="558" y="1230" text-anchor="middle" font-size="15">(1,N)</text><text x="842" y="1230" text-anchor="middle" font-size="15">(1,1)</text><text x="1058" y="1230" text-anchor="middle" font-size="15">(0,N)</text><text x="200" y="1310" text-anchor="middle" font-size="15">role: purchased input</text><text x="1200" y="1310" text-anchor="middle" font-size="15">role: prepared output</text><path class="edge" d="M700,1218 L535,1130"/><ellipse class="attr" cx="535" cy="1130" rx="85" ry="24"/><text x="535" y="1135" text-anchor="middle" font-size="14" text-decoration="underline">preparation_id</text><path class="edge" d="M700,1218 L700,1100"/><ellipse class="attr" cx="700" cy="1100" rx="85" ry="24"/><text x="700" y="1105" text-anchor="middle" font-size="14">version</text><path class="edge" d="M700,1218 L865,1130"/><ellipse class="attr" cx="865" cy="1130" rx="85" ry="24"/><text x="865" y="1135" text-anchor="middle" font-size="14">effective_from</text><path class="edge" d="M700,1282 L700,1385"/><ellipse class="attr" cx="700" cy="1385" rx="85" ry="24"/><text x="700" y="1390" text-anchor="middle" font-size="14">output_yield</text><path class="edge" d="M450,1292 L450,1360"/><ellipse class="attr" cx="450" cy="1360" rx="85" ry="24"/><text x="450" y="1365" text-anchor="middle" font-size="14">input_amount</text><text x="700" y="1460" text-anchor="middle" font-size="15">StockItem is the same entity in both roles and in the diagram above. Units: g, ml or piece.</text><text x="700" y="1495" text-anchor="middle" font-size="15">Prepared-base quantities expand into raw usage using confirmed yields; deduct raw stock once on sales approval.</text><text x="700" y="1530" text-anchor="middle" font-size="15">Powder names and yields are pending confirmation. Recipe and price edits create records, not new tables.</text></svg>